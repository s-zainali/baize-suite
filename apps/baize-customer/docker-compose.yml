services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: baize-customer
      POSTGRES_PASSWORD: baize-customer
      POSTGRES_DB: baize-customer
    ports:
      - "5433:5432"
    volumes:
      - customerdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baize-customer -d baize-customer"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  customerdata: